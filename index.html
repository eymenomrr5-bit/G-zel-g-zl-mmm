<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SILA - Çekim Kuvveti</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }

        /* Üst Panel */
        .header-box {
            margin-top: 40px;
            width: 90%;
            max-width: 400px;
            background: rgba(20, 10, 25, 0.7);
            border: 1.5px solid rgba(255, 0, 128, 0.4);
            border-radius: 20px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 0 25px rgba(255, 0, 128, 0.25), inset 0 0 15px rgba(255, 0, 128, 0.15);
            backdrop-filter: blur(8px);
            z-index: 10;
        }

        .header-box h1 {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: #ffffff;
            text-shadow: 0 0 10px #ff007f, 0 0 20px #ff007f, 0 0 30px #ff007f;
            margin-bottom: 8px;
        }

        .header-box p {
            font-size: 1rem;
            color: #f1f1f1;
            letter-spacing: 1px;
            font-weight: 300;
            opacity: 0.95;
        }

        .sparkle {
            color: #ffd700;
            text-shadow: 0 0 5px #ffd700;
        }

        /* Canvas Arka Plan / Galaksi */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Merkez İsim Etiketi */
        .center-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -120%);
            z-index: 5;
            color: #ffffff;
            font-weight: bold;
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-shadow: 0 0 8px #ff007f, 0 0 15px #ff007f;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
    </style>
</head>
<body>

    <div class="header-box">
        <h1>SILA</h1>
        <p>Çekim kuvvetine kapıldığım tek evrensin... <span class="sparkle">✨</span></p>
    </div>

    <div class="center-label">
        <span class="sparkle">✨</span> SILA <span class="sparkle">✨</span>
    </div>

    <canvas id="spaceCanvas"></canvas>

    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');

        let width, height, centerX, centerY;

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            centerX = width / 2;
            centerY = height / 2 + 30; // Görseldeki gibi biraz aşağıda
        }
        window.addEventListener('resize', resize);
        resize();

        // Kalpler (Arka Plan)
        const hearts = [];
        const heartCount = 65;

        for (let i = 0; i < heartCount; i++) {
            hearts.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 8 + 4,
                speedY: -(Math.random() * 0.4 + 0.1),
                opacity: Math.random() * 0.7 + 0.3
            });
        }

        // Kayan Yıldızlar
        const shootingStars = [];
        function createShootingStar() {
            if (Math.random() < 0.08) {
                shootingStars.push({
                    x: Math.random() * width * 1.2 - width * 0.1,
                    y: Math.random() * height * 0.5,
                    length: Math.random() * 80 + 40,
                    speed: Math.random() * 10 + 6,
                    angle: Math.PI / 4, // 45 derece eğim
                    opacity: 1
                });
            }
        }

        // Galaksi Spiral Parçacıkları
        const galaxyParticles = [];
        const particleCount = 1400;
        const radiusX = 170; // Oval genişlik
        const radiusY = 70;  // Oval yükseklik (Açısal görünüm)

        for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = Math.pow(Math.random(), 1.5); // Merkeze doğru yoğunlaşma
            galaxyParticles.push({
                angle: angle,
                dist: dist,
                speed: (1 - dist) * 0.02 + 0.005,
                size: Math.random() * 2.2 + 0.6,
                color: Math.random() > 0.3 ? '#ff00a0' : (Math.random() > 0.5 ? '#e15fed' : '#ffffff')
            });
        }

        function drawHeart(x, y, size, opacity) {
            ctx.save();
            ctx.globalAlpha = opacity;
            ctx.fillStyle = '#ff85c0';
            ctx.beginPath();
            const topCurveHeight = size * 0.3;
            ctx.moveTo(x, y + topCurveHeight);
            ctx.bezierCurveTo(x, y, x - size / 2, y, x - size / 2, y + topCurveHeight);
            ctx.bezierCurveTo(x - size / 2, y + (size + topCurveHeight) / 2, x, y + size, x, y + size);
            ctx.bezierCurveTo(x, y + size, x + size / 2, y + (size + topCurveHeight) / 2, x + size / 2, y + topCurveHeight);
            ctx.bezierCurveTo(x + size / 2, y, x, y, x, y + topCurveHeight);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            // 1. Arka Plan Kalpleri Çiz
            hearts.forEach(h => {
                h.y += h.speedY;
                if (h.y < -20) h.y = height + 20;
                drawHeart(h.x, h.y, h.size, h.opacity);
            });

            // 2. Kayan Yıldızları Çiz
            createShootingStar();
            for (let i = shootingStars.length - 1; i >= 0; i--) {
                const s = shootingStars[i];
                const endX = s.x - Math.cos(s.angle) * s.length;
                const endY = s.y + Math.sin(s.angle) * s.length;

                const grad = ctx.createLinearGradient(s.x, s.y, endX, endY);
                grad.addColorStop(0, `rgba(255, 255, 255, ${s.opacity})`);
                grad.addColorStop(1, 'rgba(255, 255, 255, 0)');

                ctx.strokeStyle = grad;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(s.x, s.y);
                ctx.lineTo(endX, endY);
                ctx.stroke();

                s.x += Math.cos(s.angle) * s.speed;
                s.y += Math.sin(s.angle) * s.speed;
                s.opacity -= 0.015;

                if (s.opacity <= 0) shootingStars.splice(i, 1);
            }

            // 3. Galaksi Diskini Dönüşle Çiz
            galaxyParticles.forEach(p => {
                p.angle += p.speed;
                
                // Elliptic orbit calculation
                const currentRadiusX = 25 + p.dist * radiusX;
                const currentRadiusY = 10 + p.dist * radiusY;

                const px = centerX + Math.cos(p.angle) * currentRadiusX;
                const py = centerY + Math.sin(p.angle) * currentRadiusY;

                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 6;
                ctx.beginPath();
                ctx.arc(px, py, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            // 4. Karadelik / Merkez Halkası
            // Dış Işıma (Beyaz Pembe Halka)
            ctx.save();
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, 28, 14, 0, 0, Math.PI * 2);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#ff00a0';
            ctx.shadowBlur = 15;
            ctx.stroke();
            ctx.restore();

            // Kara Delik (Siyah Merkez)
            ctx.beginPath();
            ctx.ellipse(centerX, centerY, 22, 11, 0, 0, Math.PI * 2);
            ctx.fillStyle = '#000000';
            ctx.fill();

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
